<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; background: {{ k.cF6F4F0 }}; color: {{ k.c1F1D1A }}; font-family: Inter, system-ui, sans-serif">
  <sc-if value="{{ ios }}" hint-placeholder-val="{{ true }}">
    <div style="padding: 0 8px; border-bottom: {{ iosLine }}">
      <div style="height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
        <span style="display: flex">
          <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}">
            <a href="{{ href }}" style="display: flex; align-items: center; height: 44px; color: {{ k.c0F5C63 }}; text-decoration: none; font-size: 17px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>{{ back }}</a>
          </sc-if>
        </span>
        <span style="font-size: 17px; font-weight: 600; text-align: center">{{ smallTitle }}</span>
        <span style="display: flex; justify-content: flex-end">
          <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}">
            <button aria-label="{{ actionLabel }}" style="width: 44px; height: 44px; border: none; background: transparent; color: {{ k.c0F5C63 }}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ actionIcon }}"></path></svg></button>
          </sc-if>
        </span>
      </div>
      <sc-if value="{{ large }}" hint-placeholder-val="{{ true }}">
        <h1 style="margin: 0; padding: 0 8px 10px; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em">{{ title }}</h1>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ android }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 0 4px">
      <div style="height: 64px; display: flex; align-items: center; gap: 4px">
        <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}">
          <a href="{{ href }}" aria-label="Back to {{ back }}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{ k.c1F1D1A }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
        </sc-if>
        <span style="flex: 1; padding-left: {{ andPad }}; font-size: 22px; font-weight: 500">{{ smallTitle }}</span>
        <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}">
          <button aria-label="{{ actionLabel }}" style="width: 48px; height: 48px; border-radius: 999px; border: none; background: transparent; color: {{ k.c1F1D1A }}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ actionIcon }}"></path></svg></button>
        </sc-if>
      </div>
      <sc-if value="{{ large }}" hint-placeholder-val="{{ true }}">
        <h1 style="margin: 0; padding: 0 12px 8px; font-size: 28px; line-height: 36px; font-weight: 500">{{ title }}</h1>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"title":{"editor":"text","default":"Title"},"back":{"editor":"text","default":"Back"},"href":{"editor":"text","default":"#"},"large":{"editor":"boolean","default":true},"action":{"editor":"enum","options":["none","share","more","add","search"],"default":"none"},"$preview":{"width":390,"height":96}}'>

    const ios = (this.props.platform ?? 'ios') !== 'android';
    const large = !(this.props.large === false || this.props.large === 'false');
    const back = this.props.back ?? '';
    const action = this.props.action ?? 'none';
    const icons = {

      add: 'M12 5v14M5 12h14',
      search: 'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM21 21l-4.3-4.3'
    };
    const labels = { share: 'Share', more: 'More options', add: 'Add', search: 'Search' };
    const title = this.props.title ?? '';
    return { k: k, darkStr: __dark ? 'true' : 'false',

      iosLine: large ? 'none' : '1px solid ' + k.cE4E0D8,
      andPad: back !== '' ? '0' : '12px'
    };
  }
}
</script>
</body>
</html>
