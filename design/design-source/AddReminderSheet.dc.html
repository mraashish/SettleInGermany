<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add reminder sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{ rootW }}; height: {{ rootH }}; position: relative; overflow: hidden; background: {{ k.cF6F4F0 }}; color: {{ k.c1F1D1A }}; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="padding: 60px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 30px; font-weight: 700">Reminders</span>
    <span style="height: 72px; border-radius: 16px; background: {{ k.cFFFFFF }}; border: 1px solid {{ k.cE4E0D8 }}"></span>
    <span style="height: 72px; border-radius: 16px; background: {{ k.cFFFFFF }}; border: 1px solid {{ k.cE4E0D8 }}"></span>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,22,21,0.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="ar-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: {{ sheetTop }}; background: {{ k.cFFFFFF }}; border-radius: {{ sheetR }}; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: {{ grabW }}; height: 4px; border-radius: 999px; background: {{ k.cCFC9BE }}"></span></div>

    <sc-if value="{{ ios }}" hint-placeholder-val="{{ true }}">
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid {{ k.cEFECE6 }}">
        <button style="min-height: 44px; padding: 0 10px; border: none; background: transparent; color: {{ k.c0F5C63 }}; font: 500 17px Inter, sans-serif">Cancel</button>
        <h1 id="ar-title" style="margin: 0; font-size: 17px; font-weight: 600">New reminder</h1>
        <button style="min-height: 44px; padding: 0 10px; border: none; background: transparent; color: {{ k.c0F5C63 }}; font: 700 17px Inter, sans-serif">Save</button>
      </div>
    </sc-if>
    <sc-if value="{{ android }}" hint-placeholder-val="{{ false }}">
      <h1 id="ar-title" style="margin: 0; padding: 16px 24px 4px; font-size: 22px; font-weight: 500">New reminder</h1>
    </sc-if>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 16px 20px 20px; overflow: hidden">
      <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 14px; font-weight: 600; color: {{ k.c3B3833 }}; padding-bottom: 10px">What is it?</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button aria-pressed="true" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.c0F5C63 }}; background: {{ k.c0F5C63 }}; color: {{ k.cFFFFFF }}; font: 600 14px Inter, sans-serif">Visa</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.cCFC9BE }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Residence permit</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.cCFC9BE }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Passport</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.cCFC9BE }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Health insurance</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.cCFC9BE }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Semester fee</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px solid {{ k.cCFC9BE }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Tax</button>
          <button aria-pressed="false" style="min-height: 40px; padding: 0 14px; border-radius: {{ chipR }}; border: 1px dashed {{ k.cA8A196 }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">Something else</button>
        </div>
      </fieldset>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: {{ k.c3B3833 }}">Expiry date
        <span style="min-height: 52px; border-radius: {{ fieldR }}; border: 1px solid {{ k.cA8A196 }}; background: {{ k.cFFFFFF }}; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 17px; font-weight: 500; color: {{ k.c1F1D1A }}">15 January 2027<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ k.c0F5C63 }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span>
        <span style="font-size: 13px; font-weight: 400; color: {{ k.c6B655C }}">German documents write this as 15.01.2027</span>
      </label>

      <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 14px; font-weight: 600; color: {{ k.c3B3833 }}; padding-bottom: 10px">Remind me</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button aria-pressed="true" style="min-height: 40px; padding: 0 12px; border-radius: {{ chipR }}; border: 1px solid {{ k.c0F5C63 }}; background: {{ k.cE6F0F0 }}; color: {{ k.c0F5C63 }}; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>90 days before</button>
          <button aria-pressed="true" style="min-height: 40px; padding: 0 12px; border-radius: {{ chipR }}; border: 1px solid {{ k.c0F5C63 }}; background: {{ k.cE6F0F0 }}; color: {{ k.c0F5C63 }}; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>30 days</button>
          <button aria-pressed="true" style="min-height: 40px; padding: 0 12px; border-radius: {{ chipR }}; border: 1px solid {{ k.c0F5C63 }}; background: {{ k.cE6F0F0 }}; color: {{ k.c0F5C63 }}; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>7 days</button>
          <button style="min-height: 40px; padding: 0 12px; border-radius: {{ chipR }}; border: 1px dashed {{ k.cA8A196 }}; background: {{ k.cFFFFFF }}; color: {{ k.c1F1D1A }}; font: 500 14px Inter, sans-serif">+ Add</button>
        </div>
      </fieldset>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: {{ k.c3B3833 }}">Note (optional)
        <span style="min-height: 72px; border-radius: {{ fieldR }}; border: 1px solid {{ k.cA8A196 }}; background: {{ k.cFFFFFF }}; padding: 12px 14px; font-size: 16px; font-weight: 400; color: {{ k.c6B655C }}; box-sizing: border-box">e.g. Book the appointment 8 weeks before</span>
      </label>

      <div style="display: flex; gap: 10px; align-items: flex-start; background: {{ k.cEFECE6 }}; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 19px; color: {{ k.c3B3833 }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>We save the date and your note only — never a photo of your document.</span>
      </div>

      <sc-if value="{{ android }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
          <button style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: none; background: transparent; color: {{ k.c0F5C63 }}; font: 600 15px Inter, sans-serif">Cancel</button>
          <button style="min-height: 48px; padding: 0 24px; border-radius: 999px; border: none; background: {{ k.c0F5C63 }}; color: {{ k.cFFFFFF }}; font: 600 15px Inter, sans-serif">Save</button>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"platform":{"editor":"enum","options":["ios","android","web"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const __dark = this.props.dark === true || this.props.dark === 'true';
    const __web = this.props.platform === 'web';
    const k = __dark ? {"cF6F4F0": "#121614", "cFFFFFF": "#1A2221", "c1F1D1A": "#ECEAE5", "c3B3833": "#C9CFCD", "c4A453E": "#C2C8C6", "c6B655C": "#9AA5A3", "cE4E0D8": "#2C3634", "cEFECE6": "#252D2C", "cCFC9BE": "#4A5755", "cA8A196": "#6F7B79", "cE9E5DD": "#252D2C", "cEDE9E1": "#252D2C", "c0F5C63": "#5CC8C2", "c0A4449": "#8EDDD8", "cE6F0F0": "#173332", "cCFE3E3": "#1F4442", "cD3E6E6": "#1F3D3B", "cE8A33D": "#F2B85C", "c2A1A00": "#2A1A00", "cFBF1DF": "#33291A", "c8A5A12": "#E0C27A", "cB7791F": "#C9A15A", "cFDF6EA": "#2A2418", "cFBEFD9": "#33291A", "c5C3D08": "#E0C27A", "c5C4A2A": "#D8C8A8", "cFDECEA": "#3A1F1C", "cB42318": "#F0A49B", "cEAF4EE": "#1D3327", "c24653F": "#7FD3A0", "c2E7D4F": "#7FD3A0", "cF3F8F8": "#16201F", "cFBFAF7": "#161C1B", "c000000": "#F2F2F2", "cFDF3E2": "#33291A", "c55524C": "#000000"} : {"cF6F4F0": "#F6F4F0", "cFFFFFF": "#FFFFFF", "c1F1D1A": "#1F1D1A", "c3B3833": "#3B3833", "c4A453E": "#4A453E", "c6B655C": "#6B655C", "cE4E0D8": "#E4E0D8", "cEFECE6": "#EFECE6", "cCFC9BE": "#CFC9BE", "cA8A196": "#A8A196", "cE9E5DD": "#E9E5DD", "cEDE9E1": "#EDE9E1", "c0F5C63": "#0F5C63", "c0A4449": "#0A4449", "cE6F0F0": "#E6F0F0", "cCFE3E3": "#CFE3E3", "cD3E6E6": "#D3E6E6", "cE8A33D": "#E8A33D", "c2A1A00": "#2A1A00", "cFBF1DF": "#FBF1DF", "c8A5A12": "#8A5A12", "cB7791F": "#B7791F", "cFDF6EA": "#FDF6EA", "cFBEFD9": "#FBEFD9", "c5C3D08": "#5C3D08", "c5C4A2A": "#5C4A2A", "cFDECEA": "#FDECEA", "cB42318": "#B42318", "cEAF4EE": "#EAF4EE", "c24653F": "#24653F", "c2E7D4F": "#2E7D4F", "cF3F8F8": "#F3F8F8", "cFBFAF7": "#FBFAF7", "c000000": "#000000", "cFDF3E2": "#FDF3E2", "c55524C": "#55524C"};
    const ios = (this.props.platform ?? 'ios') !== 'android';
    return { notWeb: !__web, rootW: __web ? '100%' : '390px', rootH: '844px', padB: __web ? '24px' : '120px', k: k, darkStr: __dark ? 'true' : 'false',
      ios: ios, android: !ios,
      sheetTop: ios ? '56px' : '120px', sheetR: ios ? '14px 14px 0 0' : '28px 28px 0 0', grabW: ios ? '36px' : '32px',
      chipR: ios ? '999px' : '8px', fieldR: ios ? '12px' : '4px'
    };
  }
}
</script>
</body>
</html>
